# ═══════════════════════════════════════════════════════════
# WebNhac - application.properties (Performance optimized)
# ═══════════════════════════════════════════════════════════

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/webnhac\
  ?useSSL=false\
  &serverTimezone=UTC\
  &allowPublicKeyRetrieval=true\
  &rewriteBatchedStatements=true\
  &cachePrepStmts=true\
  &prepStmtCacheSize=250\
  &prepStmtCacheSqlLimit=2048\
  &useServerPrepStmts=true
spring.datasource.username=root
spring.datasource.password=kimloan12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HikariCP Connection Pool ────────────────────────────────────────────────
# Trước đây: maximum-pool-size=1 → queue toàn bộ concurrent requests
# Công thức: connections = (core_count × 2) + effective_spindle_count
# Với server 4 core + SSD: 4×2 + 1 = 9, làm tròn lên 10-20
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
# Tên pool để dễ nhìn trong log/metrics
spring.datasource.hikari.pool-name=WebNhacPool

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
# Tắt show-sql trong production (tốn IO để in ra console)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Batch insert/update — quan trọng khi ghi nhiều records cùng lúc
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Tắt open-session-in-view — tránh lazy load ngoài transaction
spring.jpa.open-in-view=false

# Statistics — bật khi cần debug slow query, tắt bình thường
spring.jpa.properties.hibernate.generate_statistics=false

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# Tomcat thread pool — xử lý concurrent requests
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000
server.tomcat.accept-count=100

# Compression — giảm bandwidth cho JSON responses
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=webnhac_secret_key_change_this_in_production_min_256_bits_long
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:3000,http://localhost:3001
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ─── Upload ──────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.webnhac=INFO
# Bật SQL log chỉ khi cần debug — comment lại khi không dùng
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=INFO

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
# Bỏ qua field null trong response — giảm payload size
spring.jackson.default-property-inclusion=non_null
